name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: test, lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      # Excludes tests marked `integration` (pyproject.toml default) — those
      # need a running CareerOpportunityEngine backend and real API keys,
      # neither of which exist in CI.
      - name: Run offline test suite
        run: uv run pytest

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy agent api models prompts tools utils scripts

      - name: Build wheel
        run: uv build --wheel
