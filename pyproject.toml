[project]
name = "career-agent"
version = "0.1.0"
description = "LangGraph-based job-search agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.6.4",
    "langgraph",
    "openai",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "models", "prompts", "tools", "utils"]
