[project]
name = "job-discovery-agent"
version = "0.1.0"
description = "LangGraph-based job-search agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.4",
    "langgraph",
    "openai",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "models", "prompts", "tools", "utils"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a running CareerOpportunityEngine backend",
]
